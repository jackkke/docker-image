def redirectRepo(repo) {
    if (repo instanceof MavenArtifactRepository) {
        String url = repo.url.toString()
        if (url.contains('maven.aliyun.com') || url.contains('plugins.gradle.org')) {
            repo.setUrl('http://192.168.75.90:8081/repository/maven-public/')
            repo.setAllowInsecureProtocol(true)
            println "MavenArtifactRepository Redirect: ${url} -> http://192.168.75.90:8081/repository/maven-public/"
        }
    } else {
        if (repo.hasProperty("url")) {
            println("Unkonwn ${repo.name}, ${repo.class.name}, ${repo.url}")
        }
    }
}
import org.gradle.api.artifacts.dsl.RepositoryHandler
def oldMavenMethod = RepositoryHandler.metaClass.getMetaMethod("maven", Closure)
RepositoryHandler.metaClass.maven = { Closure closure ->
    def repo = oldMavenMethod.invoke(delegate, closure)
    redirectRepo(repo)
    return repo
}
